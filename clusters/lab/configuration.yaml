---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configuration
spec:
  interval: 8h
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: "./configuration/lab"
  dependsOn:
    - name: infrastructure
  healthCheckExprs:
    - apiVersion: tailscale.com/v1alpha1
      kind: Connector
      current: status.conditions.exists(c, c.type == 'ConnectorReady' && c.status == 'True')
