apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml

patches:
  - target:
      group: source.toolkit.fluxcd.io
      kind: GitRepository
      namespace: flux-system
      name: flux-system
    patch: |-
      - op: replace
        path: /spec/interval
        value: 6h
      - op: add
        path: /spec/decryption
        value:
          provider: sops
          secretRef:
            name: sops-age
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      namespace: flux-system
      name: flux-system
    patch: |-
      - op: replace
        path: /spec/interval
        value: 12h
