---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
spec:
  interval: 4h
  retryInterval: 2m
  timeout: 5m
  prune: true
  path: "./apps/lab"
  dependsOn:
    - name: configuration
  sourceRef:
    kind: ExternalArtifact
    name: apps
  postBuild:
    substitute:
      REST_SERVER_URL: "http://rest-server.rest-server:8000"
