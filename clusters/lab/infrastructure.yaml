---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 12h
  retryInterval: 1h
  timeout: 20m
  prune: true
  path: "./infrastructure/lab"
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cloudnative-pg
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: k8up
      namespace: k8up
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lab-path-provisioner
      namespace: lab-path-storage
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: reflector
      namespace: reflector
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tailscale-operator
      namespace: tailscale
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: operator
      namespace: intel-device-plugins