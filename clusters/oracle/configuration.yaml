---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configuration
spec:
  interval: 8h
  retryInterval: 2m
  timeout: 10m
  wait: true
  prune: true
  path: "./configuration/oracle"
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: ExternalArtifact
    name: configuration