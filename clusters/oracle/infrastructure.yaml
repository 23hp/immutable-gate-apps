---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 12h
  retryInterval: 1h
  timeout: 20m
  prune: true
  path: "./infrastructure/oracle"
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cloudnative-pg
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: local-path-provisioner
      namespace: local-path-storage
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: reflector
      namespace: reflector
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tailscale-operator
      namespace: tailscale
  decryption:
    provider: sops
    secretRef:
      name: sops-age