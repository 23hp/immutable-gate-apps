---
apiVersion: v1
kind: Namespace
metadata:
  name: external-services
---
apiVersion: v1
kind: Service
metadata:
  name: router-service
  namespace: external-services
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: router-service
  namespace: external-services
subsets:
  - addresses:
      - ip: 192.168.20.1
    ports:
      - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: router-route
  namespace: external-services
spec:
  parentRefs:
  - name: eg-gateway
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "router.${root_domain}"
  rules:
  - backendRefs:
    - name: router-service
      port: 80