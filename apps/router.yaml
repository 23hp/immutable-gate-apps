---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: traefik
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: router
  namespace: traefik
subsets:
  - addresses:
      - ip: 192.168.20.1
    ports:
      - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router-route
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`router.${root_domain}`)
    kind: Rule
    services:
    - name: router
      port: 80