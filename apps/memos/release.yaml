---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
  namespace: memos
spec:
  interval: 24h
  chart:
    spec:
      chart: ./
      version: "0.52.0"
      sourceRef:
        kind: GitRepository
        name: memos-charts
        namespace: flux-system
  values:
    podAnnotations:
      backup.velero.io/backup-volumes: "memos-data"
    image:
      repo: ghcr.io
      imageName: usememos/memos
      tag: "0.27.1"
    persistence:
      enabled: true
      existPersistClaim: memos-pvc