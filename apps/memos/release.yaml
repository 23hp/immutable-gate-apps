---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
  namespace: memos
spec:
  interval: 24h
  chart:
    spec:
      chart: memos
      version: "0.52.0"
      sourceRef:
        kind: GitRepository
        name: memos-charts
        namespace: flux-system
  values:
    persistence:
      enabled: true
      existPersistClaim: memos-pvc