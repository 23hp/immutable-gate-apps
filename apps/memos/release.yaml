---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
  namespace: memos
spec:
  interval: 24h
  chart:
    spec:
      chart: memos
      version: "0.52.0"
      sourceRef:
        kind: HelmRepository
        name: memos
        namespace: flux-system
  values:
    env:
      TZ: Europe/Berlin
    service:
      main:
        ports:
          http:
            port: 5230