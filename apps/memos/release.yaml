---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
  namespace: memos
spec:
  interval: 24h
  chart:
    spec:
      chart: memos
      version: "0.52.0"
      sourceRef:
        kind: HelmRepository
        name: memos
        namespace: flux-system
  values:
    env:
      TZ: Europe/Berlin
    persistence:
      ## If enabled is False, emptyDir will be used, data may be lost after Pod rebuild, it is recommended to use persistent volume
      enabled: false
      storageClass: "local"
      existPersistClaim: ""
      accessMode: ReadWriteOnce
      size: 10Gi