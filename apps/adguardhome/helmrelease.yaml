apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: adguardhome
  namespace: adguardhome
spec:
  interval: 5m
  chart:
    spec:
      chart: adguard-home
      version: '6.0.0'
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
  values:
    service:
      main:
        ports:
          http:
            port: 3000
          dns-tcp:
            port: 53
          dns-udp:
            port: 53
    ingress:
      main:
        enabled: true
        hosts:
        - host: adguardhome.local
          paths:
          - path: /
            pathType: Prefix
