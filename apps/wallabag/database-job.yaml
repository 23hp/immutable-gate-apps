apiVersion: batch/v1
kind: Job
metadata:
  name: wallabag-db-init
  namespace: wallabag
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      name: wallabag-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wallabag-init
          image: docker.io/wallabag/wallabag:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "==> Running Doctrine Database Migrations..."
              php bin/console doctrine:migrations:migrate --env=prod --no-interaction

              echo "==> Loading Fixtures (Creating default schema & initial user)..."
              php bin/console doctrine:fixtures:load --env=prod --no-interaction || true

              echo "==> Database initialization completed successfully!"
          env:
            - name: SYMFONY__ENV__DATABASE_DRIVER
              value: pdo_pgsql
            - name: SYMFONY__ENV__DATABASE_HOST
              value: postgres-shared-rw.database.svc.cluster.local
            - name: SYMFONY__ENV__DATABASE_PORT
              value: "5432"
            - name: SYMFONY__ENV__DATABASE_NAME
              value: wallabag
            - name: SYMFONY__ENV__DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: wallabag-db-credentials
                  key: username
            - name: SYMFONY__ENV__DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallabag-db-credentials
                  key: password