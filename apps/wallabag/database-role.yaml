apiVersion: postgresql.cnpg.io/v1
kind: Role
metadata:
  name: wallabag-user
  namespace: database
spec:
  cluster:
    name: postgres-shared
  name: wallabag_user
  ensure: present
  login: true
  
  passwordSecret:
    name: wallabag-db-credentials

  nodeTemplate:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "wallabag"