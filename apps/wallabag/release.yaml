---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wallabag
  namespace: wallabag
spec:
  interval: 24h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: wallabag
    namespace: flux-system
  values:
    wallabag:
      domainName: "https://wallabag.${domain_name}"
    postgresql:
      enabled: false
    database:
      external:
        host: postgres-shared-rw.database.svc.cluster.local
        name: wallabag
        username: wallabag_user
        existingSecret: wallabag-db-credentials