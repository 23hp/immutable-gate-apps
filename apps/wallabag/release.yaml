---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wallabag
  namespace: wallabag
spec:
  interval: 24h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: wallabag
    namespace: flux-system
  values:
    wallabag:
      existingSecret: app-secret
      domainName: "https://wallabag.${domain_name}"
      extraEnv:
        - name: "POSTGRES_USER"
          valueFrom:
            secretKeyRef:
              name: wallabag-db-credentials
              key: username
        - name: "POSTGRES_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: wallabag-db-credentials
              key: password
    postgresql:
      enabled: false
    database:
      external:
        host: postgres-shared-rw.database.svc.cluster.local
        name: wallabag
        username: wallabag_app_user
        existingSecret: app-secret
        existingSecretPasswordKey: db-password