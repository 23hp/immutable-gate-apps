apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-db
  namespace: database
spec:
  cluster:
    name: postgres-shared
  name: immich
  owner: immich_user
  extensions:
      - name: "uuid-ossp"
      - name: "pg_trgm"
      - name: "cube"
      - name: "earthdistance"
      - name: "vchord"
      - name: "vector"
