---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: immich-charts
    namespace: flux-system
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-server-pvc
    server:
      controllers:
        main:
          containers:
            main:
              env:
                TZ: Europe/Berlin
                DB_HOSTNAME: immich-database-rw
                DB_DATABASE_NAME: immich
                DB_USERNAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database
                      key: password
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                tag: release-openvino
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true