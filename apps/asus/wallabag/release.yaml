---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wallabag
  namespace: wallabag
spec:
  interval: 24h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: wallabag
    namespace: flux-system
  values:
    wallabag:
      domainName: "https://wallabag.${domain_name}"
    httpRoute:
      enabled: true
      hostnames:
      - "wallabag.${domain_name}"
      parentRefs:
      - name: eg-gateway
        namespace: envoy-gateway-system
        sectionName: https

