---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent-route
  namespace: hermes-agent
spec:
  parentRefs:
  - name: eg-gateway
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "hermes.${domain_name}"
  rules:
    - backendRefs:
        - name: hermes-agent-svc
          port: 80