---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 24h
  chart:
    spec:
      chart: nextcloud
      version: "^9.2.6"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  values:
    nextcloud:
      host: "nextcloud.${domain_name}"
      env:
        - name: OVERWRITECLIURL
          value: "https://nextcloud.${domain_name}"
        - name: OVERWRITEPROTOCOL
          value: "https"
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: username
        passwordKey: password
      configs:
        database.config.php: |-
          <?php
          $CONFIG = array (
            'setup_create_db_user' => false,
          );
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      host: postgres-shared-rw.database.svc.cluster.local:5432
      type: postgresql
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-db-credentials
        usernameKey: username
        passwordKey: password
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi
      nextcloudData:
        enabled: true
        storageClass: longhorn
        size: 15Gi
    httpRoute:
      enabled: true
      parentRefs:
      - name: eg-gateway
        namespace: envoy-gateway-system
        sectionName: https
      hostnames:
      - "nextcloud.${domain_name}"
