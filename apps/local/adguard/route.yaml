---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-adguard-home-web
  namespace: adguard
spec:
  parentRefs:
  - name: gateway
    namespace: network
    sectionName: https
  hostnames:
  - "dns.${domain_name}"
  rules:
  - backendRefs:
    - name: adguard-adguard-home-web
      port: 80