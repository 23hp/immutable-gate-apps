---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora
spec:
  interval: 24h
  chart:
    spec:
      chart: collabora-online
      version: "^1.3.3"
      sourceRef:
        kind: HelmRepository
        name: collabora
        namespace: flux-system
  values:
    route:
      enabled: true
      parentRefs:
      - name: eg-gateway
        namespace: envoy-gateway-system
        sectionName: https
      hostnames:
      - "collabora.${domain_name}"
