---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
  namespace: memos
spec:
  interval: 24h
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: memos-charts
        namespace: flux-system
  values:
    image:
      repo: ghcr.io
      imageName: usememos/memos
      tag: "0.30.0"
    persistence:
      enabled: true
      storageClass: "longhorn"
      size: 5Gi