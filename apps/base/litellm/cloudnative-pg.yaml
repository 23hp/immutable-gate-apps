apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-database
  namespace: litellm
spec:
  instances: 1
  storage:
    size: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:16-minimal-trixie
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      secret:
        name: litellm-database
