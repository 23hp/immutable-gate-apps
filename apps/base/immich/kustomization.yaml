apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - namespace.yaml
  - pvc.yaml
  - release.yaml
  - repository.yaml
  - route.yaml

secretGenerator:
  - name: immich-db-credentials
    envs:
      - ../../../configuration/lab/database/immich-credential.enc.env

configurations:
  - kustomizeconfig.yaml