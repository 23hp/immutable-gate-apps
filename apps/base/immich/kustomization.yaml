apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - namespace.yaml
  - pvc.yaml
  - release.yaml
  - repository.yaml
  - route.yaml

secretGenerator:
  - name: db-credentials
    envs:
      - db-credentials.env

configMapGenerator:
  - name: helm-release-values
    files:
      - values.yaml

configurations:
  - kustomizeconfig.yaml
