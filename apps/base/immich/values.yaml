immich:
  persistence:
    library:
      existingClaim: immich
server:
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: 3Gi
              cpu: 100m
            limits:
              gpu.intel.com/i915: 1
              memory: 4Gi
          env:
            TZ: Europe/Berlin
            DB_HOSTNAME: postgres-shared-rw.database.svc.cluster.local
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  # name: db-credentials
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  # name: db-credentials
                  key: password
          image:
            tag: v3.3.5
machine-learning:
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: 1609Mi
              cpu: 100m
            limits:
              gpu.intel.com/i915: 1
              memory: 3Gi
          image:
            tag: v3.3.5-openvino
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 9Gi
valkey:
  enabled: true
