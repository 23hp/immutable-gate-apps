---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: helm-release-values
  values:
    server:
      controllers:
        main:
          containers:
            main:
              env:
                DB_USERNAME: { valueFrom: { secretKeyRef: { name: db-credential } } }
                DB_PASSWORD: { valueFrom: { secretKeyRef: { name: db-credential } } }
  chartRef:
    kind: OCIRepository
    name: immich-charts