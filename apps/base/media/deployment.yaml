apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - name: openlist
          image: docker.io/openlistteam/openlist:v4.2.6
          ports:
            - containerPort: 5244
              name: http
          envFrom:
            - secretRef:
                name: openlist
          volumeMounts:
            - name: data
              mountPath: /opt/openlist/data
            - name: config
              mountPath: /config-migrate
              subPath: openlist
            - name: webdav
              mountPath: /webdav
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5244
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openlist-data
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: webdav
          persistentVolumeClaim:
            claimName: webdav
          
