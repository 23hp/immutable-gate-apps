apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - name: openlist
          image: docker.io/openlistteam/openlist:v4.2.6
          ports:
            - containerPort: 5244
              name: http
          env:
            - name: DB_TYPE
              value: postgres
            - name: DB_TABLE_PREFIX
              value: openlist_
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credential, key: username } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: db-credential, key: password } }
            - name: DB_DSN
              value: postgres://$(DB_USER):$(DB_PASS)@postgres-shared-rw.database:5432/media?sslmode=require
          envFrom:
            - secretRef:
                name: openlist
          volumeMounts:
            - name: data
              mountPath: /opt/openlist/data
            - name: media
              mountPath: /webdav
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 5244
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 5244
            initialDelaySeconds: 10
            periodSeconds: 600
      volumes:
        - name: data
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: media
