---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webdav
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 400Gi