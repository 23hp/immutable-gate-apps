apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openlist
spec:
  parentRefs:
    - name: gateway
      namespace: network
      sectionName: https
  hostnames:
    - openlist.${domain_name}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openlist
          port: 5244
      timeouts:
        request: 0s
