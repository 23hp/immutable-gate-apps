kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 24h
  chart:
    spec:
      chart: headlamp
      version: "^0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
  valuesFrom:
  - kind: ConfigMap
    name: helm-release-values