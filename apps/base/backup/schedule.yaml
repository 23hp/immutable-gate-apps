apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: schedule
spec:
  backend:
    rest:
      url: REST_SERVER_URL/NAMESPACE

  backup:
    # https://docs.k8up.io/k8up/references/schedule-specification.html
    schedule: "52 21 * * 0"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 2
    # Job timeout
    activeDeadlineSeconds: 5000
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
  check:
    schedule: "@monthly"
  prune:
    schedule: "@weekly"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6