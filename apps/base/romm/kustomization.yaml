apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romm
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

secretGenerator:
  - name: romm-secrets
    envs:
      - secret.env
  - name: db-credential
    envs:
      - db-credential.env
  - name: redis-credential
    envs:
      - redis.env
configMapGenerator:
  - name: romm-config
    envs:
      - config.env

images:
  - name: docker.io/rommapp/romm
    newTag: "5.4.0" 