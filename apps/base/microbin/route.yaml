apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microbin
spec:
  parentRefs:
    - name: gateway
      namespace: network
      sectionName: https
  hostnames:
    - bin.${domain_name}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: microbin
          port: 80
