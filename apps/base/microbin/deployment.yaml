apiVersion: apps/v1
kind: Deployment
metadata:
  name: microbin
  namespace: microbin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: microbin
  template:
    metadata:
      labels:
        app: microbin
    spec:
      containers:
        - name: microbin
          image: docker.io/danielszabo99/microbin:2.1.4
          ports:
            - containerPort: 8080
          env:
            - name: MICROBIN_PUBLIC_PATH
              value: https://bin.${domain_name}
            - name: MICROBIN_HASH_IDS
              value: "true"
            - name: MICROBIN_QR
              value: "true"
            - name: MICROBIN_DISABLE_TELEMETRY
              value: "true"
            - name: MICROBIN_DISABLE_UPDATE_CHECKING
              value: "true"
            - name: MICROBIN_HIDE_HEADER
              value: "true"
            - name: MICROBIN_HIDE_FOOTER
              value: "true"
            - name: MICROBIN_HIDE_LOGO
              value: "true"
            - name: MICROBIN_NO_LISTING
              value: "true"
          envFrom:
            - secretRef:
                name: envs
          volumeMounts:
            - name: data
              mountPath: /app/microbin_data
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 1800
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data