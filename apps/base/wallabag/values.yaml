wallabag:
  domainName: "https://wallabag.${domain_name}"
httpRoute:
  enabled: true
  hostnames:
  - "wallabag.${domain_name}"
  parentRefs:
  - name: gateway
    namespace: network
    sectionName: https
persistence:
  enabled: false
volumeMounts:
- name: wallabag
  mountPath: /var/www/wallabag/data
  subPath: data
- name: wallabag
  mountPath: /var/www/wallabag/web/assets/images
  subPath: images
volumes:
- name: wallabag
  persistentVolumeClaim:
    claimName: wallabag