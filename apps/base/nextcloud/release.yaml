---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 24h
  valuesFrom:
  - kind: ConfigMap
    name: helm-release-values
  values:
    nextcloud:
      existingSecret:
        secretName: admin
      extraVolumes:
        - name: post-install-script-vol
          configMap:
            name: nextcloud-post-install-script
    externalDatabase:
      existingSecret:
        secretName: db-credentials
  chart:
    spec:
      chart: nextcloud
      version: "^9.2.6"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
