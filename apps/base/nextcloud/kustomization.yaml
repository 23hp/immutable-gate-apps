apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
resources:
  - namespace.yaml
  - pvc-app.yaml
  - pvc-data.yaml
  - release.yaml
  - repository.yaml

configMapGenerator:
  - name: helm-release-values
    files:
      - values.yaml
  - name: nextcloud-post-install-script
    files:
      - setup.sh

secretGenerator:
  - name: db-credentials
    envs:
      - db-credentials.env
  - name: admin
    type: kubernetes.io/basic-auth
    envs:
      - admin.env


configurations:
  - kustomizeconfig.yaml
