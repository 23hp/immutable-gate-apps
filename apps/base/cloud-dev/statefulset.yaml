apiVersion: apps/v1
kind: StatefulSet
metadata: {name: dev}
spec:
  serviceName: dev
  replicas: 1
  selector:
    matchLabels: {app: dev}
  template:
    metadata:
      labels: {app: dev}
    spec:
      serviceAccountName: cloud-dev
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: fix-perms
        image: ghcr.io/23hp/eth-speedrun-image:v1.0.4
        imagePullPolicy: IfNotPresent
        command: ["sh","-c","chown 1000:1000 /mnt/home /mnt/scratch && chmod 755 /mnt/home /mnt/scratch"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"], add: ["CHOWN", "FOWNER"]}
        volumeMounts:
        - {name: home,    mountPath: /mnt/home}
        - {name: scratch, mountPath: /mnt/scratch}
      # When first boot, copy HOME and Homebrew folder from the default image to the empty PVC
      - name: seed
        image: ghcr.io/23hp/eth-speedrun-image:v1.0.4
        imagePullPolicy: IfNotPresent
        command: ["bash", "/scripts/seed.sh"]
        volumeMounts:
        - {name: home,        mountPath: /mnt/home}
        - {name: scratch,     mountPath: /mnt/scratch}
        - {name: seed-script, mountPath: /scripts}
      containers:
      - name: dev
        image: ghcr.io/23hp/eth-speedrun-image:v1.0.4
        imagePullPolicy: IfNotPresent
        ports:
        - {containerPort: 22}
        resources:
          requests: {cpu: "500m", memory: 1Gi}
          limits: {memory: 8Gi}
        volumeMounts:
        - {name: home,    mountPath: /home/vscode}
        - {name: scratch, mountPath: /home/linuxbrew/.linuxbrew, subPath: brew}
        - {name: scratch, mountPath: /home/vscode/.cache,        subPath: cache}
        - {name: scratch, mountPath: /home/vscode/.npm,          subPath: npm}
        - {name: scratch, mountPath: /home/vscode/.vscode-server, subPath: vscode-server}
        - {name: scratch, mountPath: /home/vscode/.mise,         subPath: mise}
        - {name: authkeys, mountPath: /authkeys-src, readOnly: true}
        - {name: setup,    mountPath: /etc/dev-setup, readOnly: true}
      volumes:
      - name: authkeys
        secret:
          secretName: ssh-authorized
          defaultMode: 0444
      - name: setup
        configMap:
          name: dev-setup
      - name: seed-script
        configMap:
          name: dev-seed-script
          defaultMode: 0555
  volumeClaimTemplates:
  - metadata:
      name: home
      annotations:
        k8up.io/backup: "true"
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: {requests: {storage: 20Gi}}
  - metadata: {name: scratch}
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: {requests: {storage: 50Gi}}