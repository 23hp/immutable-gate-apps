apiVersion: apps/v1
kind: StatefulSet
metadata: {name: dev}
spec:
  serviceName: dev
  replicas: 1
  selector:
    matchLabels: {app: dev}
  template:
    metadata:
      labels: {app: dev}
    spec:
      serviceAccountName: cloud-dev
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      # When first boot, copy HOME and Homebrew folder from the default image to the empty PVC
      - name: seed
        image: ghcr.io/23hp/eth-speedrun-image:e7a52f6de84eb3524c38b3dc82f5e17c933cad4b
        imagePullPolicy: IfNotPresent
        command: ["bash","-c"]
        args:
        - |
          set -ex
          shopt -s dotglob
          mkdir -p /mnt/scratch/brew /mnt/scratch/cache /mnt/scratch/npm /mnt/scratch/vscode-server
          if [ ! -e /mnt/home/.seeded ]; then
            cp -rf --preserve=mode,links /home/node/* /mnt/home/
            touch /mnt/home/.seeded
          fi
          if [ ! -e /mnt/scratch/brew/.seeded ]; then
            cp -rf --preserve=mode,links /home/linuxbrew/.linuxbrew/* /mnt/scratch/brew/
            touch /mnt/scratch/brew/.seeded
          fi
        volumeMounts:
        - {name: home,    mountPath: /mnt/home}
        - {name: scratch, mountPath: /mnt/scratch}
      containers:
      - name: dev
        image: ghcr.io/23hp/eth-speedrun-image:e7a52f6de84eb3524c38b3dc82f5e17c933cad4b
        imagePullPolicy: IfNotPresent
        ports:
        - {containerPort: 22}
        resources:
          requests: {cpu: "500m", memory: 1Gi}
          limits: {memory: 8Gi}
        volumeMounts:
        - {name: home,    mountPath: /home/node}
        - {name: scratch, mountPath: /home/linuxbrew/.linuxbrew, subPath: brew}
        - {name: scratch, mountPath: /home/node/.cache,          subPath: cache}
        - {name: scratch, mountPath: /home/node/.npm,            subPath: npm}
        - {name: scratch, mountPath: /home/node/.vscode-server,  subPath: vscode-server}
        - {name: authkeys, mountPath: authkeys-src, readOnly: true}
      volumes:
      - name: authkeys
        secret:
          secretName: ssh-authorized
          defaultMode: 0444
  volumeClaimTemplates:
  - metadata:
      name: home
      annotations:
        k8up.io/backup: "true"
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: {requests: {storage: 20Gi}}
  - metadata: {name: scratch}
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: {requests: {storage: 50Gi}}