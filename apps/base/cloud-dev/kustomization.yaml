apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-dev
resources:
  - namespace.yaml
  - rbac.yaml
  - route.yaml
  - service.yaml
  - statefulset.yaml

secretGenerator:
  - name: ssh-authorized
    envs:
      - ssh-authorized.env

configMapGenerator:
  - name: dev-setup
    files:
      - Brewfile
      - mise.toml
  - name: dev-seed-script
    files:
      - seed.sh