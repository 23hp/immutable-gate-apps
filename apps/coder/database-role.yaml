apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: coder-user
  namespace: database
spec:
  cluster:
    name: postgres-shared
  name: coder_user

  login: true
  superuser: true
  createdb: true
  databaseRoleReclaimPolicy: delete
  
  passwordSecret:
    name: coder-db-credentials
