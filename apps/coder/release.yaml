---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
  namespace: coder
spec:
  interval: 24h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: coder
    namespace: flux-system
  values:
    coder:
      env:
        - name: CODER_ACCESS_URL
          value: "https://coder.${domain_name}"
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-db-credentials
              key: db-url
        - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
          value: "false"
        - name: CODER_OAUTH2_GITHUB_DEVICE_FLOW
          value: "true"
        - name: CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS
          value: "true"
        - name: CODER_OAUTH2_GITHUB_ALLOW_EVERYONE
          value: "true"
        - name: CODER_OAUTH2_GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-github
              key: CODER_OAUTH2_GITHUB_CLIENT_ID
        - name: CODER_OAUTH2_GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef: 
              name: oauth2-github
              key: CODER_OAUTH2_GITHUB_CLIENT_SECRET
      httproute:
        enable: true
        host: "coder.${domain_name}"
        parentRefs:
        - name: eg-gateway
          namespace: envoy-gateway-system
          sectionName: https
      resources:
        requests:
         cpu: 150m
         memory: 512Mi
        limits:
         cpu: 2000m
         memory: 2Gi
