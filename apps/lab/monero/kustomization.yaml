apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monero
resources:
  - ../backup-schedule.yaml
patches:
  - target:
      kind: Schedule
    patch: |-
      apiVersion: k8up.io/v1
      kind: Schedule
      metadata:
        name: schedule
      spec:
        backend:
          rest:
            url: "${REST_SERVER_URL}/monero"
        backup:
          schedule: "07 22 * * 0"
        prune:
          retention:
            keepMonthly: 1