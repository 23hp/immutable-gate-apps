# apps/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database
  - ../base/cloud-dev
  - cloud-dev
  - ../base/immich
  - immich
  # - ../base/media
  # - media
  - ../base/memos
  - memos
  - ../base/microbin
  - ../base/monero
  - monero
  - ../base/wallabag
  - wallabag

secretGenerator:
  - name: db-credentials
    namespace: immich
    behavior: replace
    envs:
      - ../../configuration/lab/database/immich-credential.enc.env
  # - name: openlist
  #   namespace: media
  #   behavior: replace
  #   envs:
  #     - media/openlist.enc.env
  - name: ssh-authorized
    namespace: cloud-dev
    behavior: replace
    envs:
      - cloud-dev/ssh-authorized.enc.env