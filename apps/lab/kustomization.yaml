# apps/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cloud-dev
  - cloud-dev
  - ../base/immich
  - immich
  - ../base/media
  - media
  - ../base/memos
  - memos
  - ../base/microbin
  - ../base/monero
  - monero
  - ../base/wallabag
  - wallabag
  - test-pod.yaml

secretGenerator:
  - name: db-credential
    namespace: immich
    behavior: replace
    envs:
      - ../../shared/labs/immich-db-credential.enc.env
  - name: openlist
    namespace: media
    behavior: replace
    envs:
      - media/openlist.enc.env
  - name: ssh-authorized
    namespace: cloud-dev
    behavior: replace
    envs:
      - cloud-dev/ssh-authorized.enc.env