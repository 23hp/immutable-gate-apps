# infrastructure/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # - ../base/coder
  - ../base/hermes-agent
  - ../base/immich
  - ../base/media
  - ../base/memos
  - ../base/privatebin
  - ../base/wallabag
  - backup-database
  - backup-immich
  - backup-memos
  - backup-wallabag

secretGenerator:
  - name: db-credentials
    namespace: immich
    behavior: replace
    envs:
      - ../../configuration/lab/database/immich-credential.enc.env
  - name: openlist
    namespace: media
    behavior: replace
    envs:
      - media.openlist.enc.env