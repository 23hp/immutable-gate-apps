# apps/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cloud-dev
  - cloud-dev
  - ../base/immich
  - immich
  - ../base/media
  - media
  - ../base/memos
  - ../base/microbin
  - ../base/monero
  - ../base/wallabag
  - wallabag
  - test-pod.yaml

secretGenerator:
  - namespace: immich
    name: db-credential
    behavior: replace
    envs:
      - ../../shared/lab/immich-db-credential.enc.env
  - namespace: memos
    name: db-credential
    behavior: replace
    envs:
      - ../../shared/lab/memos-db-credential.enc.env
  - namespace: media
    name: db-credential
    behavior: replace
    envs:
      - ../../shared/lab/media-db-credential.enc.env
  - namespace: media
    name: openlist
    behavior: replace
    envs:
      - media/openlist.enc.env
  - name: ssh-authorized
    namespace: cloud-dev
    behavior: replace
    envs:
      - cloud-dev/ssh-authorized.enc.env