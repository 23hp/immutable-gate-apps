apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod
  namespace: kube-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app: test-pod
  template:
    metadata:
      labels:
        app: test-pod
    spec:
      nodeName: zebra
      containers:
      - name: ubuntu
        image: ubuntu:latest
        command: ["sleep", "infinity"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: mnt
          mountPath: /data
        - name: dev-vol
          mountPath: /dev
      volumes:
      - name: dev-vol
        hostPath:
          path: /dev
      - name: mnt
        hostPath:
          path: /var/mnt