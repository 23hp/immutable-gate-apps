---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
spec:
  interval: 24h
  chart:
    spec:
      chart: k8up
      version: ">=4.10.0"
      sourceRef:
        kind: HelmRepository
        name: k8up
  values:
    k8up:
      timezone: Europe/Berlin
      skipWithoutAnnotation: true
      envVars:
      - name: BACKUP_GLOBAL_CONCURRENT_BACKUP_JOBS_LIMIT
        value: "1"
      - name: BACKUP_GLOBAL_CONCURRENT_CHECK_JOBS_LIMIT
        value: "1"  
      - name: BACKUP_GLOBAL_CONCURRENT_PRUNE_JOBS_LIMIT
        value: "1"  
      - name: BACKUP_GLOBAL_MEMORY_LIMIT
        value: "4Gi"  
      - name: BACKUP_GLOBAL_CPU_LIMIT
        value: "2"  
      - name: BACKUP_GLOBALREPOPASSWORD
        valueFrom:
          secretKeyRef:
            name: credentials
            key: repo-password