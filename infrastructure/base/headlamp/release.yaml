---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 24h
  chart:
    spec:
      chart: headlamp
      version: "^0.46.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
  valuesFrom:
  - kind: ConfigMap
    name: helm-release-values
  values:
    config:
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: oidc
          hasScopes: true
        usePKCE: true
        autoLogin: false
    clusterRoleBinding:
      create: false