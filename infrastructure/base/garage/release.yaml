---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 24h
  # dependsOn:
  #   - namespace: local-path-storage
  #     name: local-path-provisioner
  #     name: extdisk
  chartRef:
    kind: OCIRepository
    name: garage
  values:
    config:
      defaultBucket: backup
      capacity: "2Ti"
    auth:
      existingSecret: garage-credentials
    networkPolicy:
      enabled: true
      allowExternal: true
    persistence:
      storageClass: extdisk-retain
      size: 2Ti
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
