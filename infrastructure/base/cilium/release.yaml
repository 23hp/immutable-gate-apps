---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: helm-release-values
  chart:
    spec:
      chart: cilium
      version: ">=1.20.2"
      sourceRef:
        kind: HelmRepository
        name: cilium