---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operator
spec:
  interval: 24h
  dependsOn:
    - namespace: cert-manager
      name: cert-manager
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: "0.36.x"
      sourceRef:
        kind: HelmRepository
        name: intel-charts
