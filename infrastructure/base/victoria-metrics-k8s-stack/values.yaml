# Values shared by all clusters
# Cluster specific values are provided by the overlay, e.g. infrastructure/lab/victoria-metrics/values.yaml
vmsingle:
  spec:
    retentionPeriod: "30d"
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 854Mi
      limits:
        memory: 1Gi
vmagent:
  spec:
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        memory: 300Mi
vlsingle:
  enabled: true
  spec:
    retentionPeriod: "14d"
    extraArgs:
      retention.maxDiskSpaceUsageBytes: "8GiB"
    storage:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
vlagent:
  enabled: true
  rbac:
    namespaced: false
  spec:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 192Mi }
grafana:
  plugins:
    - victoriametrics-logs-datasource
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 800Mi }
    limits: { memory: 1Gi }
  # admin:
  #   existingSecret: grafana-admin
alertmanager:
  spec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi