---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 24h
  timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: helm-release-values-default
    - kind: ConfigMap
      name: helm-release-values-overlay
      optional: true
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
    namespace: victoria-metrics