---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 24h
  # the post-install sync-job downloads dashboards and rules from upstream
  timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: helm-release-values
  values:
    vmsingle:
      spec:
        retentionPeriod: "30d"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
    vmagent:
      spec:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    grafana:
      persistence:
        enabled: true
        size: 2Gi
      # RWO volume: do not start a second pod while the old one still holds it
      deploymentStrategy:
        type: Recreate
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      # 0.x chart: ^0.96.0 only allows patch updates (<0.97.0)
      version: "^0.96.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
