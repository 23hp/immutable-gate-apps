apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id
resources:
  - namespace.yaml
  - deployment.yaml
  - PodDisruptionBudget.yaml
  - route.yaml
  - service.yaml

secretGenerator:
  - name: db-credentials
    envs:
      - db-credentials.env

configMapGenerator:
  - name: pocket-id
    files:
      - pocket-id.env