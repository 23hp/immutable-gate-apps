apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id
resources:
  - namespace.yaml
  - deployment.yaml
  - PodDisruptionBudget.yaml
  - route.yaml
  - service.yaml

secretGenerator:
  - name: db-credential
    envs:
      - db-credential.env
  - name: files
    envs:
      - files.env