---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-barman
spec:
  interval: 24h
  dependsOn:
  - namespace: cert-manager
    name: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "^0.8.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg-charts