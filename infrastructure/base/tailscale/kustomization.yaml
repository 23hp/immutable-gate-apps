apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - namespace.yaml
  - release.yaml
  - repository.yaml

configMapGenerator:
  - name: helm-release-values
    files:
      - values.yaml

secretGenerator:
  - name: oauth
    envs:
      - oauth.env

configurations:
  - kustomizeconfig.yaml