---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  interval: 24h
  chart:
    spec:
      chart: longhorn
      version: ">=1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      defaultDataPath: "/var/mnt/longhorn"
    persistence:
      defaultClassReplicaCount: 1