---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 24h
  chart:
    spec:
      chart: goldilocks
      version: "^11.2.0"
      sourceRef:
        kind: HelmRepository
        name: goldilocks
  valuesFrom:
  - kind: ConfigMap
    name: helm-release-values
