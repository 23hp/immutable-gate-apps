---
# http://garage-s3.s3.svc.cluster.local:3900
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
spec:
  selector:
    app: garage
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
---
# Management API / metrics
apiVersion: v1
kind: Service
metadata:
  name: garage-admin
  labels:
    app: garage
spec:
  selector:
    app: garage
  ports:
    - { name: admin, port: 3903, targetPort: admin }