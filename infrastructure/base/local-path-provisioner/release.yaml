---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: helm-release-values
  chart:
    spec:
      chart: local-path-provisioner
      version: ">= 0.0.35"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
  releaseName: local-path-provisioner