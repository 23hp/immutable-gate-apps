apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vlan20-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.20.3-192.168.20.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vlan20-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - vlan20-pool
  interfaces:
    - enp1s0.20