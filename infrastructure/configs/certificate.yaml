# infrastructure/configs/certificate.yaml
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-tls-secret
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
  - "${domain_name}"
  - "*.${domain_name}"
