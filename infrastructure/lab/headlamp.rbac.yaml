apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-readonly-crds
  namespace: headlamp
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases", "databaseroles", "clusters"]
    verbs: ["get", "list"]
  - apiGroups: [k8up.io"]
    resources: ["PodConfig","Restore", "Backup","Schedule","check","prune"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-crds
  namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-readonly-crds
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer