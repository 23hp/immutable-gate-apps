# This file overrides base/victoria-metrics/values.yaml (valuesFrom),
vmsingle:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vmsingle.${domain_name}
vmalert:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vmalert.${domain_name}
alertmanager:
  config:
    route:
      receiver: "discord-notifications"
      group_by: ["alertgroup", "job", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: "discord-notifications"
        discord_configs:
          - webhook_url_file: "/etc/vm/secrets/alertmanager-secrets/discord-webhook-url"
            send_resolved: true
  spec:
    secrets:
      - alertmanager-secrets
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - alertmanager.${domain_name}
vlsingle:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vlogs.${domain_name}
vlagent:
  spec:
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

    extraEnvs:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraArgs:
      envflag.enable: "true"
      fileCollector.glob: "/var/log/{kernel,machined,etcd,kubelet}.log"
      fileCollector.extraFields: '{"node":"%{NODE_NAME}"}'
      fileCollector.streamFields: "hostname,file,node"
    
grafana:
  admin:
    existingSecret: grafana-admin
  grafana.ini:
    server:
      root_url: https://grafana.${domain_name}
  route:
    main:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: network
          sectionName: https
      hostnames:
        - grafana.${domain_name}
# Talos binds controller-manager, scheduler and etcd metrics to 127.0.0.1 by default, so scraping
# them only produces "down" targets and alerts. kube-proxy is disabled (patch-cilium.yaml) and
# replaced by cilium (kubeProxyReplacement). Re-enable the first three after exposing their metrics.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false