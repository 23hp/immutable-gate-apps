# This file overrides base/victoria-metrics/values.yaml (valuesFrom),
vmsingle:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vmsingle.${domain_name}
vmalert:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vmalert.${domain_name}
alertmanager:
  config:
    route:
      receiver: "discord-notifications"
      group_by: ["alertgroup", "job", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: "discord-notifications"
        discord_configs:
          - webhook_url_file: "/etc/vm/secrets/alertmanager-secrets/discord-webhook-url"
            send_resolved: true
    inhibit_rules:
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: ["namespace"]
  spec:
    secrets:
      - alertmanager-secrets
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - alertmanager.${domain_name}
vlsingle:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vlogs.${domain_name}
vlagent:
  spec:
    extraEnvs:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraArgs:
      envflag.enable: "true"
      fileCollector.glob: "/var/log/{kernel,machined,etcd,kubelet}.log"
      fileCollector.extraFields: '{"node":"%{NODE_NAME}"}'
      fileCollector.streamFields: "hostname,file,node"
    
grafana:
  envFromSecret: grafana-oidc
  admin:
    existingSecret: grafana-admin
  grafana.ini:
    server:
      root_url: https://grafana.${domain_name}
    auth.generic_oauth:
      enabled: true
      name: Pocket ID
      allow_sign_up: true
      auto_login: false
      scopes: openid email profile groups
      auth_url: https://id.${domain_name}/authorize
      token_url: https://id.${domain_name}/api/oidc/token
      use_pkce: true
      login_attribute_path: preferred_username
      name_attribute_path: name
      role_attribute_path: >-
        contains(groups[*], 'k8s-admins') && 'Admin' ||
        contains(groups[*], 'grafana-editors') && 'Editor' ||
        contains(groups[*], 'grafana-viewers') && 'Viewer'
      role_attribute_strict: true
  route:
    main:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: network
          sectionName: https
      hostnames:
        - grafana.${domain_name}
# Talos binds controller-manager, scheduler and etcd metrics to 127.0.0.1 by default, so scraping
# them only produces "down" targets and alerts. kube-proxy is disabled (patch-cilium.yaml) and
# replaced by cilium (kubeProxyReplacement). Re-enable the first three after exposing their metrics.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: true
  service:
    enabled: false
  vmScrape:
    enabled: false
kubeProxy:
  enabled: false