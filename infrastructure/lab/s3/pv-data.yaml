apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-data
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/mnt/hdd/garage-pv
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["zebra"]