apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: s3
resources:
  - namespace.yaml
  - pv-data.yaml
  - pv-meta.yaml
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
 
secretGenerator:
  - name: garage-secrets
    envs:
      - garage.enc.env