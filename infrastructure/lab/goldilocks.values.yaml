vpa:
  enabled: true
  updater:
    enabled: false
  admissionController:
    enabled: false
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls
controller:
  flags:
    on-by-default: true
    exclude-namespaces: kube-system,kube-public,kube-node-lease
    ignore-controller-kind: Job,CronJob
dashboard:
  flags:
    on-by-default: true
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - goldilocks.${domain_name}