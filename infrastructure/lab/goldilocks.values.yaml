vpa:
  enabled: true
  updater:
    enabled: false
  admissionController:
    enabled: false
  recommender:
    extraArgs:
      history-length: "30d"
      storage: "prometheus"
      prometheus-address: "http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc.cluster.local:8428"

controller:
  flags:
    on-by-default: true
    exclude-namespaces: kube-system,kube-public,kube-node-lease
    ignore-controller-kind: Job,CronJob

dashboard:
  flags:
    on-by-default: true
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - goldilocks.${domain_name}