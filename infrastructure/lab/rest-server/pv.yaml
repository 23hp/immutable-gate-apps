  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: backup-disk
  spec:
    capacity: {storage: 3500Gi}
    accessModes: [ReadWriteOnce]
    persistentVolumeReclaimPolicy: Retain
    storageClassName: backup-local
    local:
      path: /var/mnt/backup
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists