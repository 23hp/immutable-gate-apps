  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: backup
  spec:
    capacity: {storage: 3500Gi}
    accessModes: [ReadWriteOnce]
    persistentVolumeReclaimPolicy: Retain
    storageClassName: ""
    local:
      path: /var/mnt/hdd
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - zebra