apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: rest-server}
  template:
    metadata:
      labels: {app: rest-server}
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: rest-server
        image: docker.io/restic/rest-server:0.14.0
        env:
        - {name: DISABLE_AUTHENTICATION, value: "1"}
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "384Mi"
            cpu: "120m"
          limits:
            memory: "384Mi"
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: backup-disk
