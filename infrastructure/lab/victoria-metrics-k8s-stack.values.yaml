# This file replaces base/victoria-metrics-k8s-stack/values.yaml (valuesFrom),
# values shared by all clusters are in base release.yaml (spec.values).
vmsingle:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vmsingle.${domain_name}
vmalert:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vmalert.${domain_name}
alertmanager:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - alertmanager.${domain_name}
vlsingle:
  route:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: network
        sectionName: https
    hostnames:
      - vlogs.${domain_name}
grafana:
  grafana.ini:
    server:
      root_url: https://grafana.${domain_name}
  route:
    main:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: network
          sectionName: https
      hostnames:
        - grafana.${domain_name}
# Talos binds controller-manager, scheduler and etcd metrics to 127.0.0.1 by default, so scraping
# them only produces "down" targets and alerts. kube-proxy is disabled (patch-cilium.yaml) and
# replaced by cilium (kubeProxyReplacement). Re-enable the first three after exposing their metrics.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false