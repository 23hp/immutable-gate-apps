---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: extdisk
  namespace: local-path-storage
spec:
  interval: 24h
  chart:
    spec:
      chart: local-path-provisioner
      version: ">= 0.0.35"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
  values:
    storageClass:
      name: extdisk-retain
      reclaimPolicy: Retain
      provisionerName: rancher.io/extdisk-retain
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/hdd-4g