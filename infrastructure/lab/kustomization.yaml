# infrastructure/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cert-manager
  - ../base/cloudnative-pg
  - ../base/goldilocks
  - ../base/headlamp
  - ../base/intel-device-plugins
  - ../base/k8up
  - ../base/local-path-provisioner
  - ../base/network
  - ../base/tailscale
  - ../base/victoria-metrics-k8s-stack
  - ../base/roles/view-extra.yaml
  - ../base/roles/workload-scaler.yaml
  # - ../base/garage
  # - local-path-provisioner.extdisk.yaml

configMapGenerator:
  - name: helm-release-values
    namespace: local-path-storage
    behavior: replace
    files:
      - local-path-provisioner/values.yaml
  - name: helm-release-values
    namespace: headlamp
    behavior: replace
    files:
      - values.yaml=headlamp.values.yaml
  - name: helm-release-values
    namespace: goldilocks
    behavior: replace
    files:
      - values.yaml=goldilocks.values.yaml
  - name: helm-release-values
    namespace: victoria-metrics
    behavior: replace
    files:
      - values.yaml=victoria-metrics-k8s-stack.values.yaml

secretGenerator:
  - name: credentials
    namespace: k8up
    behavior: replace
    envs:
      - k8up.credentials.enc.env
  - name: oauth
    namespace: tailscale
    behavior: replace
    envs:
      - tailscale.oauth.enc.env