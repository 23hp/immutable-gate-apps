# infrastructure/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cert-manager
  - ../base/cloudnative-pg
  - ../base/headlamp
  - ../base/intel-device-plugins
  - ../base/k8up
  - ../base/kubernetes-event-exporter
  - ../base/local-path-provisioner
  - ../base/network
  - ../base/s3
  - ../base/tailscale
  - ../base/victoria-metrics-k8s-stack
  - ../base/roles/view-extra.yaml
  - ../base/roles/workload-scaler.yaml
  - victoria-metrics

configMapGenerator:
  - name: helm-release-values
    namespace: local-path-storage
    behavior: replace
    files:
      - local-path-provisioner/values.yaml
  - name: helm-release-values
    namespace: headlamp
    behavior: replace
    files:
      - values.yaml=headlamp.values.yaml
  - name: helm-release-values-overlay
    namespace: victoria-metrics
    files:
      - victoria-metrics/values.yaml

secretGenerator:
  - namespace: k8up
    name: credentials
    behavior: replace
    envs:
      - k8up.credentials.enc.env
  - namespace: k8up
    name: s3-secrets
    behavior: replace
    envs:
      - s3/s3.enc.env
  - namespace: tailscale
    name: oauth
    behavior: replace
    envs:
      - tailscale.oauth.enc.env
  - namespace: tailscale
    name: oauth
    behavior: replace
    envs:
      - tailscale.oauth.enc.env
  - namespace: s3
    name: garage-secrets
    behavior: replace
    envs:
      - s3/garage.enc.env
  - namespace: s3
    name: s3-secrets
    behavior: replace
    envs:
      - s3/s3.enc.env