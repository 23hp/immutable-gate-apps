---
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 24h
  url: https://charts.rook.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  releaseName: local-path-provisioner
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: HelmRepository
    name: local-path-provisioner
  chart:
    spec:
      chart: local-path-provisioner
      version: "0.0.*"
  values:
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NEW_NODES
        paths: ["/var/mnt/local-data"]
    storageClass:
      defaultClass: true