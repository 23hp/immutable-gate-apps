---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 24h
  releaseName: velero
  chart:
    spec:
      chart: velero
      version: ">= 12.1.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  values:
    # needs CSI support, not available in local-path-provisioner
    snapshotsEnabled: false
    deployNodeAgent: true

    credentials:
      existingSecret: velero-credentials

    configuration:
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero
          default: true
          config:
            region: velero
            s3ForcePathStyle: "true"
            s3Url: http://garage-garage-headless.velero.svc.cluster.local:3900
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
