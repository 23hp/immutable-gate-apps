---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 24h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
    namespace: flux-system
  values:
    master:
      extraArgs:
        - "-resource-labels=intel.feature.node.kubernetes.io/gpu"