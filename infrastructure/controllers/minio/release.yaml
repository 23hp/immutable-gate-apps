---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 24h
  releaseName: minio
  chartRef:
    kind: OCIRepository
    name: minio
    namespace: flux-system
  values:
    mode: standalone
    auth:
      existingSecret: minio-credentials
      rootUserSecretKey: rootUser
      rootPasswordSecretKey: rootPassword
    defaultBuckets: velero
    persistence:
      enabled: true
      storageClass: local-path-hdd
      size: 2000Gi
