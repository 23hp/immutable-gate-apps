---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 24h
  releaseName: minio
  chartRef:
    kind: OCIRepository
    name: minio
    namespace: flux-system
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      registry: docker.io
      repository: minio/minio
      tag: RELEASE.2025-09-07T16-13-09Z
    mode: standalone
    auth:
      existingSecret: minio-credentials
      rootUserSecretKey: rootUser
      rootPasswordSecretKey: rootPassword
    defaultBuckets: velero
    persistence:
      enabled: true
      storageClass: local-path-hdd
      size: 2000Gi
