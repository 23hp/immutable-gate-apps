---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 24h
  releaseName: minio
  chart:
    spec:
      chart: minio
      version: ">= 14.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    mode: standalone
    auth:
      existingSecret: minio-credentials
      rootUserSecretKey: rootUser
      rootPasswordSecretKey: rootPassword
    defaultBuckets: velero
    persistence:
      enabled: true
      storageClass: local-path-hdd
      size: 2000Gi
