---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 24h
  releaseName: minio
  chart:
    spec:
      chart: minio
      version: ">= 8.0.10"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system
  values:
    existingSecret: minio-credentials
    buckets:
      - name: velero
        policy: none
        purge: false
    defaultBuckets: velero
    persistence:
      storageClass: local-path-hdd
      size: 2Ti
