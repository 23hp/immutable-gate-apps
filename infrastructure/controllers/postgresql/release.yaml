---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: postgresql
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: postgresql
    namespace: flux-system
  values:
    image:
      registry: ghcr.io
      repository: immich-app/postgres
      tag: 16-vectorchord0.5.3
    global:
      security:
        allowInsecureImages: true
    primary:
      containerSecurityContext:
        readOnlyRootFilesystem: false
    common:
      resources:
        preset: "small"
