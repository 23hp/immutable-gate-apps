apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app-namespaces.yaml
  - cert-manager.yaml
  - envoy.yaml
  - k8sgpt-operator.yaml
  - local-path-provisioner.yaml
  - metallb.yaml
  - secrets.yaml
patches:
  - target:
      kind: ServiceAccount
      name: default
    patch: |-
      - op: add
        path: /automountServiceAccountToken
        value: false