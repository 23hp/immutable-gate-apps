apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner-hdd
  namespace: local-path-storage
spec:
  releaseName: local-path-provisioner-hdd
  interval: 24h
  chart:
    spec:
      chart: local-path-provisioner
      version: ">= 0.0.35"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    storageClass:
      name: local-path-hdd
      defaultClass: false
      provisionerName: rancher.io/u-hdd-4g
    configmap:
      name: local-path-config-hdd
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/u-hdd-4g