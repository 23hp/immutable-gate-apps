apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 36h
  url: https://metallb.github.io/metallb
ref:
  semver: "0.15.x"
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 24h
  chartRef:
    kind: HelmRepository
    name: metallb
    namespace: flux-system
  values:
    crds:
      enabled: true
    speaker:
      tolerateMaster: true
