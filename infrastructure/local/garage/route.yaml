---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-route
  namespace: garage
spec:
  parentRefs:
  - name: gateway
    namespace: network
    sectionName: https
  hostnames:
  - "garage.${domain_name}"
  rules:
    - backendRefs:
        - name: garage-garage
          port: 3900