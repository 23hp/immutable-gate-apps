apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cert-manager
  - ../base/intel-device-plugins
  - ../base/k8up
  - ../base/local-path-provisioner
  - ../base/reflector
  - ../base/tailscale
  - envoy
  - metallb
  - k8up.secret.sops.yaml
  - tailscale.secret.sops.yaml

secretGenerator:
  - name: helm-release-values
    namespace: k8up
    behavior: replace
    files:
      - values.yaml=../lab/k8up.values.enc.yaml