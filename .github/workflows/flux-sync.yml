name: Trigger Flux Sync via Tailscale

on:
    push:
        branches:
            - main

jobs:
    notify-flux:
        runs-on: ubuntu-latest
        steps:
            - name: Connect to Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Trigger Internal Flux Webhook
              run: |
                  curl --fail --silent --show-error --max-time 10 --retry 3 -X POST "http://lab-flux-receiver/hook/${{ secrets.FLUX_WEBHOOK_HASH }}"
