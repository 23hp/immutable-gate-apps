apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - schedule.yaml
replacements:
  - source:
      kind: Schedule
      name: schedule
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Schedule
          name: schedule
        fieldPaths:
          - spec.backend.rest.url
        options:
          delimiter: "/"
          index: 3