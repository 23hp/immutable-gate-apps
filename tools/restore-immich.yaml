apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: manual-pvc-restore
  namespace: immich
spec:
  snapshot: "8aa699c2d6765f300a9c1bdd1891aa0bcbb7347cd8a3a959df1439f8c3a2b436"
  restoreMethod:
    folder:
      claimName: "immich"
  backend:
    s3:
      bucket: backup
      endpoint: "https://s3.labs123.uk"
      accessKeyIDSecretRef:
          name: s3-credentials
          key: accessKeyID
      secretAccessKeySecretRef:
          name: s3-credentials
          key: secretAccessKey
  # To allow changing the owner of the restored files, we need to run as root.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0