
---
apiVersion: k8up.io/v1
kind: Backup
metadata:
  name: manual-pvc-backup-wallabag
  namespace: wallabag
spec:
  backend:
    s3:
      bucket: backup
      endpoint: "https://s3.labs123.uk"
      accessKeyIDSecretRef:
          name: s3-credentials
          key: accessKeyID
      secretAccessKeySecretRef:
          name: s3-credentials
          key: secretAccessKey
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0