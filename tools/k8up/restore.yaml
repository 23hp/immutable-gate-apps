apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: restore
  namespace: monero
spec:
  snapshot: "a4c15d8c"
  restoreMethod:
    folder:
      claimName: data
  backend:
    rest:
      # url: REST_SERVER_URL/NAMESPACE
      url: http://rest-server.rest-server/monero
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0