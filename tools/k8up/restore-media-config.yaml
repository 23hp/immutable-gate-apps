apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: restore-config
  namespace: media
spec:
  snapshot: "8049a4d0"
  restoreMethod:
    folder:
      claimName: config
  backend:
    rest:
      # url: REST_SERVER_URL/NAMESPACE
      url: http://rest-server.rest-server/media
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0