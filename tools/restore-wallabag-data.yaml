apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: manual-pvc-restore-data
  namespace: wallabag
spec:
  snapshot: "1d73713984c28a2656f3f318fc3b5922fe5f0954ac0e7ab80e7073c948b9a2e7"
  restoreMethod:
    folder:
      claimName: "wallabag-data"
  backend:
    s3:
      bucket: backup
      endpoint: "https://s3.labs123.uk"
      accessKeyIDSecretRef:
          name: s3-credentials
          key: accessKeyID
      secretAccessKeySecretRef:
          name: s3-credentials
          key: secretAccessKey
  # To allow changing the owner of the restored files, we need to run as root.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0