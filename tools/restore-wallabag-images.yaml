apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: manual-pvc-restore-images
  namespace: wallabag
spec:
  snapshot: "90c2d93211b33cd8b6b60fc87954b3a7abb24e6793678ac9a6eba8aaa57ce8bc"
  restoreMethod:
    folder:
      claimName: "wallabag-images"
  backend:
    s3:
      bucket: backup
      endpoint: "https://s3.labs123.uk"
      accessKeyIDSecretRef:
          name: s3-credentials
          key: accessKeyID
      secretAccessKeySecretRef:
          name: s3-credentials
          key: secretAccessKey
  # To allow changing the owner of the restored files, we need to run as root.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0