# configuration/local/database
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - immich-database.yaml
  - immich-role.yaml
  - namespace.yaml
  - nextcloud-database.yaml
  - nextcloud-role.yaml

secretGenerator:
  - name: immich-db-credentials
    type: kubernetes.io/basic-auth
    envs:
      - immich-credential.enc.env
  - name: nextcloud-db-credentials
    type: kubernetes.io/basic-auth
    envs:
      - nextcloud-credential.enc.env

configurations:
  - kustomizeconfig.yaml
