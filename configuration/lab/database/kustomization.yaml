# configuration/local/database
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - cluster.yaml
  - immich-database.yaml
  - immich-role.yaml
  - namespace.yaml

secretGenerator:
  - name: immich-db-credentials
    type: kubernetes.io/basic-auth
    envs:
      - immich-credential.enc.env
  - name: s3-secrets
    envs:
      - ../../../infrastructure/lab/s3/s3.enc.env

configurations:
  - kustomizeconfig.yaml
