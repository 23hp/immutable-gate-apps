# configuration/local/database
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - cluster.yaml
  - immich-database.yaml
  - immich-role.yaml
  - namespace.yaml
  - object-store.yaml
  - pocket-database.yaml
  - pocket-role.yaml
  - scheduled-backup.yaml

secretGenerator:
  - name: immich-db-credential
    type: kubernetes.io/basic-auth
    envs:
      - ../../../shared/lab/immich-db-credential.enc.env
  - name: pocket-db-credential
    type: kubernetes.io/basic-auth
    envs:
      - ../../../shared/lab/pocket-db-credential.enc.env
  - name: s3-secrets
    envs:
      - ../../../shared/lab/s3.enc.env

configurations:
  - kustomizeconfig.yaml
