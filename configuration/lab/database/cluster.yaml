apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared
  annotations:
    # set to "on" to shutdown instances, usecase: k8s upgrade, shutdown cluster
    # quickstart: kubectl annotate cluster.postgresql.cnpg.io postgres-shared cnpg.io/hibernation=on --overwrite -n database
    cnpg.io/hibernation: "off"
spec:
  storage:
    size: 15Gi
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.13-1.1.1
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  # HA for cluster lab
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  # backup configuration
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: false
    parameters:
      barmanObjectName: s3-store