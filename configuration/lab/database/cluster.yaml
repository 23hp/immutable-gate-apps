apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared
  annotations:
    # set to "on" to shutdown instances, usecase: k8s upgrade, shutdown cluster
    # quickstart: kubectl annotate cluster.postgresql.cnpg.io postgres-shared cnpg.io/hibernation=on --overwrite -n database
    cnpg.io/hibernation: "off"
spec:
  storage:
    size: 15Gi
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.13-1.1.1
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  # HA for cluster lab
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  # k8up backup configuration
  inheritedMetadata:
    annotations:
      k8up.io/file-extension: ".tar"
      k8up.io/backupcommand: >-
        bash -c 'set -euo pipefail;
        d=$(mktemp -d); trap "rm -rf $d" EXIT;
        for db in $(psql -U postgres -d postgres -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate AND datallowconn ORDER BY 1"); do
        if [ "$db" != postgres ]; then pg_dump -Fc -Z0 -U postgres -d "$db" -f "$d/$db.dump"; fi;
        done;
        tar -C "$d" -cf - .'
