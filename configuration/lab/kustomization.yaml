# configuration/lab/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cert-manager
  - ../base/flux-receiver
  - ../base/gateway
  - ../base/pocket-id
  - ../base/tailscale
  - ../base/intel-device-plugins.gpu.yaml
  - database
  - victoria-metrics
  - tailscale.connector.yaml

secretGenerator:
  - name: cloudflare
    namespace: cert-manager
    behavior: replace
    envs:
      - cert-manager.cloudflare.enc.env
  - name: token
    namespace: flux-system
    behavior: replace
    envs:
      - flux-receiver.token.enc.env
  - namespace: pocket-id
    name: db-credential
    behavior: replace
    envs:
      - ../../shared/lab/pocket-db-credential.enc.env
  - namespace: pocket-id
    name: files
    behavior: replace
    envs:
      - pocket-id.files.enc.env
