apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: nfs-schedule
spec:
  podConfigRef:
    name: podconfig
  backend:
    local:
      mountPath: /mnt/nfs-backup
    volumeMounts:
      - name: nfs-backup
        mountPath: /mnt/nfs-backup
  backup:
    schedule: "12 17 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 2
    # Job timeout
    activeDeadlineSeconds: 5000
  check:
    schedule: "0 4 1 * *"
  prune:
    schedule: "20 3 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6