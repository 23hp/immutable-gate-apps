apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: podconfig

spec:
  template:
    spec:
      containers:
        - name: k8up
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumes:
        - name: nfs-backup
          nfs:
            server: wifi
            path: /mnt/sda1/k8up
