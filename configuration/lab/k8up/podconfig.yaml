apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: podconfig

spec:
  template:
    spec:
      containers:
        - name: backup
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: nfs-backup
              mountPath: /mnt/nfs-backup
              subPathExpr: $(POD_NAMESPACE)
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumes:
        - name: nfs-backup
          nfs:
            server: wifi
            path: /mnt/sda1/k8up
