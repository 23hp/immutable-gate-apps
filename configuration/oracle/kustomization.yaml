# configuration/oracle/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/flux-receiver
  - ../base/tailscale
  - database

secretGenerator:
  - name: token
    namespace: flux-system
    behavior: replace
    envs:
      - flux-receiver.token.enc.env
