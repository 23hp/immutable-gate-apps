apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-receiver-funnel
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: webhook-receiver
      port:
        number: 80
  tls:
    - hosts:
        - "${cluster_name}-flux-receiver"