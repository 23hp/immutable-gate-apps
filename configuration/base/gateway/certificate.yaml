# infrastructure/configs/certificate.yaml
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
spec:
  secretName: wildcard-tls-secret
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - "${domain_name}"
    - "*.${domain_name}"
    - "*.coder.${domain_name}"
