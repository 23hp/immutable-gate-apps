---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu
  namespace: intel-device-plugins
spec:
  interval: 24h
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: '0.35.x'
      sourceRef:
        kind: HelmRepository
        name: intel-charts
        namespace: flux-system
  values:
    sharedDevNum: 5