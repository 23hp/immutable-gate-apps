apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway-backend-svc
  namespace: envoy-gateway-system
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/hostname: "${cluster_name}-gateway"
spec:
  loadBalancerClass: tailscale
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
